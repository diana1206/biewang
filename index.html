<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f0f">
<link rel="manifest" href="./manifest.json">
<title>别忘 — 待办提醒器</title>
<style>
  :root {
    --bg: #0f0f0f;
    --card: #1a1a1a;
    --accent: #ff6b35;
    --green: #4ecb71;
    --blue: #3b82f6;
    --red: #e74c3c;
    --text: #e8e8e8;
    --sub: #888;
    --border: #2a2a2a;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    position: relative;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ====== 主界面 ====== */
  #app {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-bottom: calc(80px + var(--safe-bottom));
  }

  .header {
    padding: 16px 20px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .badge-count {
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    min-width: 26px;
    height: 26px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 8px;
  }
  .badge-count:empty { display: none; }
  .settings-btn {
    width: 36px; height: 36px;
    background: transparent;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--sub);
  }

  /* ====== 内容区 ====== */
  .content {
    flex: 1;
    padding: 16px 20px;
    overflow-y: auto;
  }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--sub);
    margin: 18px 0 10px;
  }
  .section-label:first-child { margin-top: 0; }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--sub);
    font-size: 14px;
    line-height: 1.6;
  }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }

  /* ====== 任务卡片 ====== */
  .task-card {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    border-left: 3px solid transparent;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.2s;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .task-card:active { transform: scale(0.98); }
  .task-card.urgent  { border-left-color: var(--accent); }
  .task-card.soon    { border-left-color: var(--blue); }
  .task-card.doing   { border-left-color: var(--green); background: #0d1a12; }

  .task-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .task-info { flex: 1; min-width: 0; }
  .task-time {
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .task-time.urgent-time { color: var(--accent); }
  .task-time.soon-time   { color: var(--blue); }
  .task-time.doing-time  { color: var(--green); }
  .task-important { font-size: 10px; background: var(--accent); color: #fff; padding: 1px 6px; border-radius: 8px; }

  .task-title {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.4;
    word-break: break-all;
  }
  .task-meta {
    font-size: 11px;
    color: var(--sub);
    margin-top: 4px;
  }
  .task-timer {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 13px;
    font-weight: 700;
    color: var(--green);
    background: #0a1f0f;
    padding: 4px 10px;
    border-radius: 10px;
    white-space: nowrap;
  }
  .task-delay-badge {
    font-size: 10px;
    color: var(--accent);
    background: #1f0f0a;
    padding: 2px 8px;
    border-radius: 8px;
    white-space: nowrap;
  }

  /* ====== 底栏 ====== */
  .tabs {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: #111;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    padding: 8px 0 calc(8px + var(--safe-bottom));
    z-index: 50;
  }
  .tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 10px;
    color: var(--sub);
    cursor: pointer;
    padding: 6px 20px;
    border: none;
    background: none;
    transition: 0.2s;
  }
  .tab.active { color: var(--accent); }
  .tab .tab-icon { font-size: 20px; }
  .tab .tab-badge {
    font-size: 10px;
    background: var(--accent);
    color: #fff;
    min-width: 16px;
    height: 16px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: 2px;
    margin-left: 16px;
  }

  /* ====== FAB ====== */
  .fab {
    position: fixed;
    bottom: 90px;
    right: max(20px, calc((100vw - 480px) / 2 + 20px));
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(255,107,53,0.4);
    z-index: 49;
    transition: transform 0.2s;
  }
  .fab:active { transform: scale(0.9); }

  /* ====== 模态层 ====== */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    animation: fadeIn 0.2s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal-sheet {
    background: #1a1a1a;
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 480px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px 20px calc(24px + var(--safe-bottom));
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  .modal-handle {
    width: 40px; height: 4px;
    background: #444;
    border-radius: 2px;
    margin: 0 auto 20px;
  }

  /* ====== 提醒弹窗（居中） ====== */
  .reminder-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.25s;
    padding: 20px;
  }
  .reminder-card {
    background: #1a1a1a;
    border-radius: 24px;
    padding: 32px 24px;
    width: 100%;
    max-width: 340px;
    text-align: center;
    border: 1px solid var(--accent);
    box-shadow: 0 0 60px rgba(255,107,53,0.15);
    animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .reminder-icon { font-size: 56px; margin-bottom: 10px; }
  .reminder-level {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .reminder-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .reminder-note {
    font-size: 13px;
    color: var(--sub);
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .reminder-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .btn {
    padding: 14px 20px;
    border-radius: 14px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary {
    background: var(--green);
    color: #fff;
    font-size: 17px;
  }
  .btn-secondary {
    background: #222;
    color: #ccc;
    border: 1px solid #333;
  }
  .btn-tertiary {
    background: transparent;
    color: var(--sub);
    font-size: 13px;
    text-decoration: underline;
  }
  .btn-danger {
    background: var(--accent);
    color: #fff;
  }
  .delay-info {
    font-size: 11px;
    color: var(--accent);
    margin-top: 4px;
  }

  /* ====== 第3级全屏打断 ====== */
  .interrupt-overlay {
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    z-index: 300;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    text-align: center;
    animation: fadeIn 0.3s;
  }
  .interrupt-ring {
    width: 90px; height: 90px;
    background: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    margin-bottom: 28px;
    animation: urgentPulse 1s infinite;
  }
  @keyframes urgentPulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,107,53,0.5); }
    50%    { box-shadow: 0 0 0 30px rgba(255,107,53,0); }
  }
  .interrupt-stage {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--accent);
    margin-bottom: 16px;
  }
  .interrupt-title {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .interrupt-sub {
    font-size: 14px;
    color: var(--sub);
    margin-bottom: 36px;
    line-height: 1.5;
  }
  .interrupt-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 300px;
  }

  /* ====== 快速添加页 ====== */
  .input-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
  }
  .input-nl {
    flex: 1;
    background: #222;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    color: #fff;
    font-size: 16px;
    outline: none;
    font-family: inherit;
    transition: border 0.2s;
  }
  .input-nl:focus { border-color: var(--accent); }
  .input-nl::placeholder { color: #444; }
  .voice-btn {
    width: 48px; height: 48px;
    background: var(--accent);
    border: none;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
    color: #fff;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .voice-btn.listening {
    animation: urgentPulse 0.6s infinite;
    background: var(--red);
  }

  .parse-result {
    background: #111;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 14px;
    color: var(--green);
    margin-bottom: 14px;
    display: none;
    line-height: 1.5;
  }
  .parse-result.show { display: block; }
  .parse-result.no-time { color: var(--blue); }
  .parse-result.failed { color: var(--sub); }

  .time-chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .chip {
    padding: 8px 14px;
    background: #222;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    color: #aaa;
    cursor: pointer;
    transition: 0.15s;
    font-family: inherit;
  }
  .chip.selected {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .field-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .field-row label {
    font-size: 14px;
    color: #aaa;
    white-space: nowrap;
  }
  .field-row input {
    flex: 1;
    background: #222;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: #fff;
    font-size: 15px;
    outline: none;
    font-family: inherit;
  }
  .field-row input:focus { border-color: var(--accent); }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    color: #aaa;
    font-size: 14px;
  }
  .toggle {
    width: 48px; height: 28px;
    background: #333;
    border-radius: 14px;
    cursor: pointer;
    position: relative;
    transition: background 0.2s;
  }
  .toggle.on { background: var(--accent); }
  .toggle::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 22px; height: 22px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.2s;
  }
  .toggle.on::after { transform: translateX(20px); }

  .btn-add {
    width: 100%;
    padding: 16px;
    background: var(--accent);
    border: none;
    border-radius: 14px;
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.1s;
  }
  .btn-add:active { transform: scale(0.97); }

  /* ====== 进行中全屏 ====== */
  .doing-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 250;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
    animation: fadeIn 0.2s;
  }
  .doing-ring {
    width: 150px; height: 150px;
    border-radius: 50%;
    border: 4px solid var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
    animation: doingPulse 2s infinite;
  }
  @keyframes doingPulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(78,203,113,0.4); }
    50%    { box-shadow: 0 0 0 24px rgba(78,203,113,0); }
  }
  .doing-time-display {
    font-size: 38px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--green);
  }
  .doing-task-name {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .doing-hint {
    font-size: 13px;
    color: var(--sub);
    margin-bottom: 36px;
  }
  .doing-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 220px;
  }

  /* ====== Toast ====== */
  .toast {
    position: fixed;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--green);
    color: #fff;
    padding: 12px 24px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    z-index: 400;
    animation: toastIn 0.3s ease, toastOut 0.3s ease 1.7s forwards;
    pointer-events: none;
  }
  @keyframes toastIn  { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } }
  @keyframes toastOut { to   { opacity: 0; transform: translateX(-50%) translateY(-10px); } }

  /* ====== 音效 ====== */
  .hidden-audio { display: none; }
</style>
</head>
<body>

<div id="app">
  <!-- 头部 -->
  <div class="header">
    <span class="logo">📋 别忘</span>
    <div class="header-right">
      <span class="badge-count" id="headerBadge"></span>
      <button class="settings-btn" onclick="openSettings()" title="设置">⚙️</button>
    </div>
  </div>

  <!-- 内容区 -->
  <div class="content" id="content"></div>

  <!-- 底栏 -->
  <div class="tabs">
    <button class="tab active" data-tab="pending" onclick="switchTab('pending')">
      <span class="tab-icon">📋</span>待完成
      <span class="tab-badge" id="tabPendingBadge" style="display:none"></span>
    </button>
    <button class="tab" data-tab="doing" onclick="switchTab('doing')">
      <span class="tab-icon">⏱</span>进行中
      <span class="tab-badge" id="tabDoingBadge" style="display:none"></span>
    </button>
    <button class="tab" data-tab="done" onclick="switchTab('done')">
      <span class="tab-icon">✅</span>已完成
    </button>
  </div>

  <!-- FAB -->
  <button class="fab" onclick="openAddModal()">+</button>
</div>

<script>
// ===================================================================
// 「别忘」— 核心引擎
// ===================================================================

// ---------- 存储 ----------
const STORAGE_KEY = 'bw_tasks';

function loadTasks() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}

function saveTasks(tasks) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  updateBadges();
}

// ---------- 状态 ----------
let tasks = loadTasks();
let currentTab = 'pending';
let reminderQueue = [];          // 待处理的提醒队列
let activeReminder = false;     // 是否有提醒正在显示
let activeDoingId = null;       // 当前进行中全屏的任务 ID
let reminderCheckInterval = null;

// ---------- 工具函数 ----------
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function fmtTime(date) {
  const now = new Date();
  const d = new Date(date);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const tomorrow = new Date(today.getTime() + 86400000);
  const targetDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());

  if (targetDay.getTime() === today.getTime()) return '今天 ' + hh + ':' + mm;
  if (targetDay.getTime() === tomorrow.getTime()) return '明天 ' + hh + ':' + mm;
  if (targetDay.getTime() - today.getTime() <= 86400000 * 6) {
    const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    return days[d.getDay()] + ' ' + hh + ':' + mm;
  }
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + hh + ':' + mm;
}

function isOverdue(task) {
  return task.time && new Date(task.time) < new Date() && task.status === 'pending';
}

function formatDuration(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if (h > 0) return h + 'h ' + String(m).padStart(2, '0') + 'm';
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

// ---------- 音效 ----------
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function beep(freq, duration, type = 'square') {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = 0.15;
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + duration);
  } catch (e) { /* 静默失败 */ }
}

function playReminderSound(level) {
  if (level === 1) {
    beep(880, 0.15); setTimeout(() => beep(880, 0.15), 300); setTimeout(() => beep(880, 0.3), 600);
  } else if (level === 2) {
    for (let i = 0; i < 4; i++) setTimeout(() => beep(1000, 0.12), i * 200);
  } else if (level >= 3) {
    for (let i = 0; i < 8; i++) setTimeout(() => beep(1200, 0.1), i * 150);
  }
}

function vibrate(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
}

// ---------- 智能时间解析 ----------
function parseNaturalLanguage(text) {
  const now = new Date();
  let targetTime = null;
  let title = text.trim();

  // 提取时间模式
  const patterns = [
    // "今晚X点" / "今天晚上X点"
    { regex: /(?:今晚|今天晚上|今晚晚上)\s*(\d{1,2})\s*[点:：](\d{0,2})?/, handler: (m) => {
      const h = parseInt(m[1]), mi = m[2] ? parseInt(m[2]) : 0;
      const d = new Date(); d.setHours(h, mi, 0, 0);
      if (d < now) d.setDate(d.getDate() + 1);
      return d;
    }},
    // "今天X点"
    { regex: /今天\s*(\d{1,2})\s*[点:：](\d{0,2})?/, handler: (m) => {
      const h = parseInt(m[1]), mi = m[2] ? parseInt(m[2]) : 0;
      const d = new Date(); d.setHours(h, mi, 0, 0);
      return d;
    }},
    // "明天X点"
    { regex: /明天\s*(\d{1,2})\s*[点:：](\d{0,2})?/, handler: (m) => {
      const h = parseInt(m[1]), mi = m[2] ? parseInt(m[2]) : 0;
      const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(h, mi, 0, 0);
      return d;
    }},
    // "后天X点"
    { regex: /后天\s*(\d{1,2})\s*[点:：](\d{0,2})?/, handler: (m) => {
      const h = parseInt(m[1]), mi = m[2] ? parseInt(m[2]) : 0;
      const d = new Date(); d.setDate(d.getDate() + 2); d.setHours(h, mi, 0, 0);
      return d;
    }},
    // "周X X点" 如 "周三3点" "周五10点"
    { regex: /周([一二三四五六日])\s*(\d{1,2})\s*[点:：](\d{0,2})?/, handler: (m) => {
      const dayMap = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '日': 0 };
      const targetDay = dayMap[m[1]];
      const h = parseInt(m[2]), mi = m[3] ? parseInt(m[3]) : 0;
      const d = new Date();
      const currentDay = d.getDay();
      let diff = targetDay - currentDay;
      if (diff <= 0) diff += 7;
      d.setDate(d.getDate() + diff);
      d.setHours(h, mi, 0, 0);
      return d;
    }},
    // "X分钟后" / "X小时后"
    { regex: /(\d+)\s*分钟\s*后/, handler: (m) => {
      return new Date(now.getTime() + parseInt(m[1]) * 60000);
    }},
    { regex: /(\d+)\s*小时\s*后/, handler: (m) => {
      return new Date(now.getTime() + parseInt(m[1]) * 3600000);
    }},
    // "X点半" 不带日期 默认今天
    { regex: /(\d{1,2})\s*点半/, handler: (m) => {
      const h = parseInt(m[1]);
      const d = new Date(); d.setHours(h, 30, 0, 0);
      if (d < now) d.setDate(d.getDate() + 1);
      return d;
    }},
    // 纯时间 "22:00" / "10:30"
    { regex: /(\d{1,2}):(\d{2})(?!\d)/, handler: (m) => {
      const h = parseInt(m[1]), mi = parseInt(m[2]);
      const d = new Date(); d.setHours(h, mi, 0, 0);
      if (d < now) d.setDate(d.getDate() + 1);
      return d;
    }},
    // "上午X点" / "下午X点" / "晚上X点"
    { regex: /(上午|中午|下午|晚上|早上)\s*(\d{1,2})\s*[点:：](\d{0,2})?/, handler: (m) => {
      let h = parseInt(m[2]);
      const period = m[1];
      if (period === '下午' && h < 12) h += 12;
      if (period === '晚上' && h < 12) h += 12;
      if (period === '中午' && h < 12) h += 12;
      const mi = m[3] ? parseInt(m[3]) : 0;
      const d = new Date(); d.setHours(h, mi, 0, 0);
      if (d < now) d.setDate(d.getDate() + 1);
      return d;
    }},
  ];

  for (const p of patterns) {
    const match = title.match(p.regex);
    if (match) {
      targetTime = p.handler(match);
      // 移除时间部分，保留纯标题
      title = title.replace(match[0], '').trim();
      // 清理多余的空格和间隔符
      title = title.replace(/^[,，。、\s]+/, '').replace(/[,，。、\s]+$/, '');
      break;
    }
  }

  // 清理连接词
  title = title.replace(/^(要|需要|记得|别忘了|去|做一下|一下)/, '').trim();
  if (!title) title = text.replace(/[:：]\s*\d{1,2}/, '').trim();
  if (!title) title = '未命名待办';

  return { time: targetTime, title: title || '未命名待办' };
}

// ---------- 提醒引擎 ----------
function getDelayInterval(delayCount) {
  // 第1次推迟 5min, 第2次 3min, 第3次 1min, 第4次及以后 30s
  const intervals = [5 * 60 * 1000, 3 * 60 * 1000, 60 * 1000, 30 * 1000];
  return intervals[Math.min(delayCount, intervals.length - 1)];
}

function getReminderLevel(delayCount) {
  return Math.min(delayCount + 1, 4);
}

function triggerReminder(task) {
  if (activeReminder) {
    // 已有提醒在处理，加入队列
    reminderQueue.push(task);
    return;
  }
  showReminder(task);
}

function processReminderQueue() {
  if (reminderQueue.length > 0 && !activeReminder) {
    const next = reminderQueue.shift();
    showReminder(next);
  }
}

function showReminder(task) {
  activeReminder = true;
  const level = getReminderLevel(task.delayCount || 0);

  playReminderSound(level);

  if (level === 1) {
    vibrate([200, 100, 200]);
  } else if (level === 2) {
    vibrate([200, 100, 200, 100, 400]);
  } else if (level >= 3) {
    vibrate([300, 150, 300, 150, 300, 150, 600]);
  }

  if (level >= 3) {
    showInterruptOverlay(task);
  } else {
    showReminderCard(task);
  }
}

function showReminderCard(task) {
  const level = getReminderLevel(task.delayCount || 0);
  const nextInterval = getDelayInterval(task.delayCount || 0);
  const nextMinutes = Math.round(nextInterval / 60000);

  const overlay = document.createElement('div');
  overlay.className = 'reminder-overlay';
  overlay.id = 'reminderOverlay';
  overlay.innerHTML = `
    <div class="reminder-card">
      <div class="reminder-icon">🔔</div>
      <div class="reminder-level">第 ${level} 级提醒</div>
      <div class="reminder-title">${escapeHtml(task.title)}</div>
      <div class="reminder-note">
        ${task.delayCount > 0
          ? `你已经推迟了 <strong>${task.delayCount}</strong> 次<br>现在是第 ${level} 级提醒`
          : '预约时间到了，现在可以开始做这件事'}
      </div>
      <div class="reminder-actions">
        <button class="btn btn-primary" id="btnStart">✅ 开始做</button>
        <button class="btn btn-secondary" id="btnDelay">
          ⏰ 忙，${nextMinutes} 分钟后提醒
        </button>
        <button class="btn btn-tertiary" id="btnQuick">⚡ 快速勾掉（秒完成）</button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);

  overlay.querySelector('#btnStart').onclick = () => {
    overlay.remove();
    activeReminder = false;
    startDoing(task);
    processReminderQueue();
  };

  overlay.querySelector('#btnDelay').onclick = () => {
    overlay.remove();
    activeReminder = false;
    delayTask(task);
    processReminderQueue();
  };

  overlay.querySelector('#btnQuick').onclick = () => {
    overlay.remove();
    activeReminder = false;
    completeTask(task);
    processReminderQueue();
  };

  // 点击背景也触发推迟？不，这里必须选一个
}

function showInterruptOverlay(task) {
  const overlay = document.createElement('div');
  overlay.className = 'interrupt-overlay';
  overlay.id = 'interruptOverlay';
  overlay.innerHTML = `
    <div class="interrupt-ring">⚠️</div>
    <div class="interrupt-stage">第 ${getReminderLevel(task.delayCount || 0)} 级 · 请立即处理</div>
    <div class="interrupt-title">${escapeHtml(task.title)}</div>
    <div class="interrupt-sub">
      你已经推迟了 <strong>${task.delayCount}</strong> 次<br>
      ${task.important ? '⚡ 重要事项，不能再推迟' : '这件事不能再拖了'}
    </div>
    <div class="interrupt-actions">
      <button class="btn btn-primary" id="btnIntStart">✅ 现在开始做</button>
      <button class="btn btn-tertiary" id="btnIntQuick">⚡ 快速勾掉</button>
    </div>
  `;

  document.body.appendChild(overlay);

  overlay.querySelector('#btnIntStart').onclick = () => {
    overlay.remove();
    activeReminder = false;
    startDoing(task);
    processReminderQueue();
  };

  overlay.querySelector('#btnIntQuick').onclick = () => {
    overlay.remove();
    activeReminder = false;
    completeTask(task);
    processReminderQueue();
  };
}

function delayTask(task) {
  task.delayCount = (task.delayCount || 0) + 1;
  const nextInterval = getDelayInterval(task.delayCount);
  task.nextRemindAt = Date.now() + nextInterval;
  saveTasks(tasks);
  showToast('⏰ 将在 ' + Math.round(nextInterval / 60000) + ' 分钟后再次提醒');
  render();
}

function startDoing(task) {
  task.status = 'doing';
  task.doingStartedAt = Date.now();
  task.checkBackAt = Date.now() + 30 * 60 * 1000; // 30分钟后回访
  task.delayCount = 0;
  saveTasks(tasks);
  showDoingScreen(task);
  render();

  // 发送系统通知（如果支持）
  trySendNotification('⏱ 开始计时 — ' + task.title, '30分钟后会回访问你是否完成');
}

function completeTask(task) {
  task.status = 'done';
  task.completedAt = Date.now();
  task.delayCount = 0;
  saveTasks(tasks);
  showToast('✅ 已完成：' + task.title);
  render();
}

// ---------- 进行中计时全屏 ----------
let doingTimerInterval = null;

function showDoingScreen(task) {
  if (activeDoingId) closeDoingScreen();
  activeDoingId = task.id;

  const screen = document.createElement('div');
  screen.className = 'doing-screen';
  screen.id = 'doingScreen';
  screen.innerHTML = `
    <div class="doing-ring">
      <span class="doing-time-display" id="doingTimer">00:00</span>
    </div>
    <div class="doing-task-name">${escapeHtml(task.title)}</div>
    <div class="doing-hint">正在计时中 · 30分钟后回访问你</div>
    <div class="doing-actions">
      <button class="btn btn-primary" id="btnDone">✅ 完成了</button>
      <button class="btn btn-secondary" id="btnExtend">⏳ 还在做，30分钟后再问</button>
      <button class="btn btn-tertiary" id="btnRestart">🔄 重新开始（被中断了）</button>
      <button class="btn btn-tertiary" id="btnCloseDoing">✕ 关闭计时（会继续后台计时）</button>
    </div>
  `;
  document.body.appendChild(screen);

  // 计时器
  const updateTimer = () => {
    const elapsed = Date.now() - task.doingStartedAt;
    document.getElementById('doingTimer').textContent = formatDuration(elapsed);
  };
  updateTimer();
  doingTimerInterval = setInterval(updateTimer, 1000);

  screen.querySelector('#btnDone').onclick = () => {
    closeDoingScreen();
    completeTask(task);
  };
  screen.querySelector('#btnExtend').onclick = () => {
    task.checkBackAt = Date.now() + 30 * 60 * 1000;
    saveTasks(tasks);
    closeDoingScreen();
    showToast('⏳ 30分钟后会再次回访');
    render();
  };
  screen.querySelector('#btnRestart').onclick = () => {
    task.doingStartedAt = Date.now();
    task.checkBackAt = Date.now() + 30 * 60 * 1000;
    saveTasks(tasks);
    updateTimer();
    showToast('🔄 重新开始计时');
  };
  screen.querySelector('#btnCloseDoing').onclick = () => {
    closeDoingScreen();
    showToast('⏱ 后台继续计时中');
    render();
  };
}

function closeDoingScreen() {
  if (doingTimerInterval) { clearInterval(doingTimerInterval); doingTimerInterval = null; }
  const el = document.getElementById('doingScreen');
  if (el) el.remove();
  activeDoingId = null;
}

// ---------- 回访提醒 ----------
function showCheckback(task) {
  if (activeReminder) { reminderQueue.push({ ...task, isCheckback: true }); return; }
  activeReminder = true;

  const overlay = document.createElement('div');
  overlay.className = 'reminder-overlay';
  overlay.id = 'reminderOverlay';
  overlay.innerHTML = `
    <div class="reminder-card" style="border-color: var(--blue);">
      <div class="reminder-icon">🤔</div>
      <div class="reminder-level" style="color: var(--blue);">回访确认</div>
      <div class="reminder-title">做完了吗？</div>
      <div class="reminder-note">
        <strong>${escapeHtml(task.title)}</strong><br>
        已经做了 ${formatDuration(Date.now() - task.doingStartedAt)}
      </div>
      <div class="reminder-actions">
        <button class="btn btn-primary" id="btnCBDone">✅ 做完了！</button>
        <button class="btn btn-secondary" id="btnCBExtend">⏳ 还没，30分钟后再问</button>
        <button class="btn btn-tertiary" id="btnCBRestart">🔄 重新开始（被中断了）</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelector('#btnCBDone').onclick = () => {
    overlay.remove();
    activeReminder = false;
    completeTask(task);
    processReminderQueue();
  };
  overlay.querySelector('#btnCBExtend').onclick = () => {
    task.checkBackAt = Date.now() + 30 * 60 * 1000;
    saveTasks(tasks);
    overlay.remove();
    activeReminder = false;
    showToast('⏳ 30分钟后会再次回访');
    render();
    processReminderQueue();
  };
  overlay.querySelector('#btnCBRestart').onclick = () => {
    task.doingStartedAt = Date.now();
    task.checkBackAt = Date.now() + 30 * 60 * 1000;
    saveTasks(tasks);
    overlay.remove();
    activeReminder = false;
    showToast('🔄 重新开始计时');
    render();
    processReminderQueue();
  };
}

// ---------- 主循环（检查提醒） ----------
function checkReminders() {
  const now = Date.now();

  for (const task of tasks) {
    // 检查待办时间到了
    if (task.status === 'pending' && task.time && !task.reminderActive) {
      const dueTime = new Date(task.time).getTime();
      if (dueTime <= now) {
        triggerReminder(task);
        task.reminderActive = true;
      }
    }

    // 检查推迟后的再次提醒
    if (task.status === 'pending' && task.nextRemindAt && task.nextRemindAt <= now && !task.reminderActive) {
      triggerReminder(task);
      task.reminderActive = true;
    }

    // 检查回访
    if (task.status === 'doing' && task.checkBackAt && task.checkBackAt <= now) {
      showCheckback(task);
      task.checkBackAt = null; // 避免重复触发
    }
  }

  saveTasks(tasks);
}

function startReminderLoop() {
  if (reminderCheckInterval) clearInterval(reminderCheckInterval);
  reminderCheckInterval = setInterval(checkReminders, 15000); // 每15秒检查一次
}

// ---------- 系统通知 ----------
let swRegistration = null;
async function initServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  try {
    swRegistration = await navigator.serviceWorker.register('./sw.js');
  } catch (e) {
    // Service Worker 注册失败，app仍可正常使用（仅后台通知不可用）
  }
}

async function trySendNotification(title, body) {
  if (!swRegistration) return;
  try {
    await swRegistration.showNotification(title, {
      body,
      icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="40" fill="%230f0f0f"/><text x="96" y="120" font-size="100" text-anchor="middle">📋</text></svg>',
      badge: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="40" fill="%23ff6b35"/><text x="96" y="120" font-size="100" text-anchor="middle">🔔</text></svg>',
      vibrate: [200, 100, 200],
      tag: 'biewang-reminder'
    });
    // 请求通知权限
    if (Notification.permission === 'default') {
      await Notification.requestPermission();
    }
  } catch (e) { /* 静默 */ }
}

// ---------- 渲染 ----------
function render() {
  const content = document.getElementById('content');
  const now = new Date();

  // 分类任务
  const doingTasks = tasks.filter(t => t.status === 'doing');
  const pendingTasks = tasks.filter(t => t.status === 'pending');
  const doneTasks = tasks.filter(t => t.status === 'done');

  // 排序
  pendingTasks.sort((a, b) => {
    const aOverdue = a.time && new Date(a.time) < now;
    const bOverdue = b.time && new Date(b.time) < now;
    if (aOverdue && !bOverdue) return -1;
    if (!aOverdue && bOverdue) return 1;
    if (a.time && b.time) return new Date(a.time) - new Date(b.time);
    if (a.time) return -1; if (b.time) return 1;
    return (b.createdAt || 0) - (a.createdAt || 0);
  });

  doneTasks.sort((a, b) => (b.completedAt || 0) - (a.completedAt || 0));
  doingTasks.sort((a, b) => (b.doingStartedAt || 0) - (a.doingStartedAt || 0));

  let html = '';

  if (currentTab === 'pending') {
    // 进行中的任务也在待完成tab顶部显示
    if (doingTasks.length > 0) {
      html += '<div class="section-label">⏱ 进行中</div>';
      for (const task of doingTasks) {
        html += renderTaskCard(task);
      }
    }

    html += '<div class="section-label">🔥 待完成</div>';
    if (pendingTasks.length === 0) {
      html += '<div class="empty-state"><div class="empty-icon">🎉</div>没有待办事项<br>点击 + 添加一个吧</div>';
    } else {
      for (const task of pendingTasks) {
        html += renderTaskCard(task);
      }
    }
  } else if (currentTab === 'doing') {
    html += '<div class="section-label">⏱ 进行中</div>';
    if (doingTasks.length === 0) {
      html += '<div class="empty-state"><div class="empty-icon">⏸</div>没有进行中的事项</div>';
    } else {
      for (const task of doingTasks) {
        html += renderTaskCard(task);
      }
    }
  } else if (currentTab === 'done') {
    // 按日期分组
    html += '<div class="section-label">✅ 已完成</div>';
    if (doneTasks.length === 0) {
      html += '<div class="empty-state"><div class="empty-icon">📭</div>还没有完成过事项</div>';
    } else {
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const todayDone = doneTasks.filter(t => t.completedAt && new Date(t.completedAt) >= today);
      const earlierDone = doneTasks.filter(t => t.completedAt && new Date(t.completedAt) < today);

      if (todayDone.length > 0) {
        html += '<div style="font-size:12px;color:var(--sub);margin:12px 0 6px;">今天</div>';
        for (const task of todayDone) html += renderTaskCard(task);
      }
      if (earlierDone.length > 0) {
        html += '<div style="font-size:12px;color:var(--sub);margin:12px 0 6px;">更早</div>';
        for (const task of earlierDone) html += renderTaskCard(task);
      }
    }
  }

  content.innerHTML = html;

  // 绑定任务卡片点击事件
  content.querySelectorAll('.task-card').forEach(card => {
    card.onclick = function(e) {
      const taskId = this.dataset.taskId;
      const task = tasks.find(t => t.id === taskId);
      if (!task) return;
      if (task.status === 'doing') {
        showDoingScreen(task);
      } else if (task.status === 'pending') {
        showTaskOptions(task);
      } else if (task.status === 'done') {
        showTaskOptions(task);
      }
    };
  });

  updateBadges();
}

function renderTaskCard(task) {
  const now = new Date();
  let timeHtml = '';
  let cardClass = '';
  let timeClass = '';

  if (task.status === 'doing') {
    cardClass = 'doing';
    timeClass = 'doing-time';
    const elapsed = Date.now() - task.doingStartedAt;
    timeHtml = '🟢 已进行 ' + formatDuration(elapsed);
    if (task.delayCount > 0) {
      timeHtml += ' <span class="task-delay-badge">推迟' + task.delayCount + '次</span>';
    }
  } else if (task.status === 'done') {
    timeHtml = '✅ ' + (task.completedAt ? fmtTime(task.completedAt) + ' 完成' : '已完成');
    cardClass = '';
    timeClass = '';
  } else if (task.time) {
    const overdue = new Date(task.time) < now;
    if (overdue) {
      cardClass = 'urgent';
      timeClass = 'urgent-time';
      timeHtml = '🔴 已超时 · ' + fmtTime(task.time);
    } else {
      const timeDiff = new Date(task.time) - now;
      if (timeDiff < 3600000) { // 1小时内
        cardClass = 'urgent'; timeClass = 'urgent-time';
      } else {
        cardClass = 'soon'; timeClass = 'soon-time';
      }
      timeHtml = '⏰ ' + fmtTime(task.time);
    }
    if (task.delayCount > 0) {
      timeHtml += ' <span class="task-delay-badge">推迟' + task.delayCount + '次</span>';
    }
  } else {
    timeHtml = '📌 无截止时间';
  }

  if (task.important && task.status === 'pending') {
    timeHtml += ' <span class="task-important">重要</span>';
  }

  return `
    <div class="task-card ${cardClass}" data-task-id="${task.id}">
      <div class="task-row">
        <div class="task-info">
          <div class="task-time ${timeClass}">${timeHtml}</div>
          <div class="task-title">${escapeHtml(task.title)}</div>
        </div>
      </div>
    </div>
  `;
}

// ---------- 任务操作菜单 ----------
function showTaskOptions(task) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-mask';
  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };

  let extraBtns = '';
  if (task.status === 'pending') {
    extraBtns = `
      <button class="btn btn-primary" id="optStart">✅ 开始做</button>
      <button class="btn btn-secondary" id="optComplete">⚡ 标记完成</button>

    `;

      <button class="btn btn-secondary" id="optComplete">✅ 标记完成</button>
    `;
  } else if (task.status === 'done') {
    extraBtns = `

  overlay.innerHTML = `
    <div class="modal-sheet">

      <h3 style="margin-bottom:6px;">${escapeHtml(task.title)}</h3>

        ${task.time ? fmtTime(task.time) : '无截止时间'}
        ${task.important ? ' · 🔴 重要' : ''}
        ${task.delayCount > 0 ? ' · 已推迟 ' + task.delayCount + ' 次' : ''}
      </p>
      <div style="display:flex;flex-direction:column;gap:10px;">
        ${extraBtns}
        <button class="btn btn-tertiary" id="optCancel">取消</button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);

  const bind = (id, fn) => { const el = overlay.querySelector(id); if (el) el.onclick = () => { overlay.remove(); fn(); }; };
  bind('#optStart', () => startDoing(task));
  bind('#optResume', () => showDoingScreen(task));
  bind('#optComplete', () => completeTask(task));
  bind('#optUndo', () => { task.status = 'pending'; task.completedAt = null; saveTasks(tasks); render(); showToast('↩ 已恢复到待办列表'); });
  bind('#optDelete', () => { tasks = tasks.filter(t => t.id !== task.id); saveTasks(tasks); render(); showToast('🗑 已删除'); });
  bind('#optCancel', () => {});
}

// ---------- 快速添加 ----------
function openAddModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-mask';
  overlay.id = 'addModal';
  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };

  overlay.innerHTML = `
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <h3 style="margin-bottom:16px;font-size:20px;font-weight:700;">新建待办</h3>

      <div class="input-row">
        <input class="input-nl" id="nlInput" placeholder="输入描述，自动识别时间..."
          value="" autofocus autocomplete="off">
        <button class="voice-btn" id="voiceBtn" title="语音录入">🎤</button>
      </div>

      <div class="parse-result" id="parseResult"></div>

      <div class="time-chips" id="timeChips">
        <button class="chip" data-time="today-20">今晚8点</button>
        <button class="chip" data-time="today-21">今晚9点</button>
        <button class="chip" data-time="today-22">今晚10点</button>
        <button class="chip" data-time="tomorrow-9">明天上午</button>
        <button class="chip" data-time="+60">一小时后</button>
        <button class="chip" data-time="+30">30分钟后</button>
        <button class="chip" data-time="notime">无时间</button>
      </div>

      <div class="field-row">
        <label>📝 事项</label>
        <input id="titleInput" placeholder="事项描述">
      </div>

      <div class="field-row">
        <label>⏰ 时间</label>
        <input id="timeInput" type="datetime-local">
      </div>

      <div class="toggle-row">
        <span>🔴 标记为重要</span>
        <div class="toggle" id="importantToggle" onclick="this.classList.toggle('on')"></div>
      </div>

      <button class="btn-add" id="btnConfirmAdd">添加待办</button>
    </div>
  `;

  document.body.appendChild(overlay);

  const nlInput = overlay.querySelector('#nlInput');
  const titleInput = overlay.querySelector('#titleInput');
  const timeInput = overlay.querySelector('#timeInput');
  const parseResult = overlay.querySelector('#parseResult');
  const chips = overlay.querySelectorAll('#timeChips .chip');

  let parsedTime = null;
  let parsedTitle = '';

  // 实时解析
  nlInput.oninput = function() {
    const text = this.value.trim();
    if (!text) {
      parseResult.className = 'parse-result';
      parsedTime = null; parsedTitle = '';
      titleInput.value = '';
      timeInput.value = '';
      return;
    }
    const result = parseNaturalLanguage(text);
    parsedTime = result.time;
    parsedTitle = result.title;
    titleInput.value = result.title;

    if (result.time) {
      const now = new Date();
      const diff = result.time - now;
      if (diff < 0) {
        parseResult.className = 'parse-result no-time show';
        parseResult.innerHTML = '⚠️ 识别的时间已过期：<strong>' + result.time.toLocaleString('zh-CN') + '</strong>';
      } else {
        parseResult.className = 'parse-result show';
        parseResult.innerHTML = '✅ 识别时间：<strong>' + fmtTime(result.time) + '</strong> — "' + escapeHtml(result.title) + '"';
      }
      // 设置 datetime-local 值
      const yy = result.time.getFullYear();
      const mm = String(result.time.getMonth() + 1).padStart(2, '0');
      const dd = String(result.time.getDate()).padStart(2, '0');
      const hh = String(result.time.getHours()).padStart(2, '0');
      const mi = String(result.time.getMinutes()).padStart(2, '0');
      timeInput.value = yy + '-' + mm + '-' + dd + 'T' + hh + ':' + mi;
    } else {
      parseResult.className = 'parse-result no-time show';
      parseResult.innerHTML = '📌 未识别到时间，添加为无截止时间待办："<strong>' + escapeHtml(result.title) + '</strong>"';
      timeInput.value = '';
    }
  };

  // 快捷时间标签
  chips.forEach(chip => {
    chip.onclick = function() {
      chips.forEach(c => c.classList.remove('selected'));
      this.classList.add('selected');
      const val = this.dataset.time;
      const now = new Date();

      if (val === 'notime') {
        parsedTime = null;
        timeInput.value = '';
        parseResult.className = 'parse-result no-time show';
        parseResult.innerHTML = '📌 无截止时间待办';
      } else if (val.startsWith('today-')) {
        const h = parseInt(val.split('-')[1]);
        parsedTime = new Date(); parsedTime.setHours(h, 0, 0, 0);
        timeInput.value = parsedTime.getFullYear() + '-' + String(parsedTime.getMonth()+1).padStart(2,'0') + '-' + String(parsedTime.getDate()).padStart(2,'0') + 'T' + String(h).padStart(2,'0') + ':00';
        parseResult.className = 'parse-result show';
        parseResult.innerHTML = '✅ 时间：<strong>' + fmtTime(parsedTime) + '</strong>';
      } else if (val.startsWith('tomorrow-')) {
        const h = parseInt(val.split('-')[1]);
        parsedTime = new Date(); parsedTime.setDate(parsedTime.getDate() + 1); parsedTime.setHours(h, 0, 0, 0);
        timeInput.value = parsedTime.getFullYear() + '-' + String(parsedTime.getMonth()+1).padStart(2,'0') + '-' + String(parsedTime.getDate()).padStart(2,'0') + 'T0' + h + ':00';
        parseResult.className = 'parse-result show';
        parseResult.innerHTML = '✅ 时间：<strong>' + fmtTime(parsedTime) + '</strong>';
      } else if (val.startsWith('+')) {
        const min = parseInt(val.slice(1));
        parsedTime = new Date(now.getTime() + min * 60000);
        const yy = parsedTime.getFullYear();
        const mo = String(parsedTime.getMonth()+1).padStart(2,'0');
        const dd = String(parsedTime.getDate()).padStart(2,'0');
        const hh = String(parsedTime.getHours()).padStart(2,'0');
        const mi = String(parsedTime.getMinutes()).padStart(2,'0');
        timeInput.value = yy + '-' + mo + '-' + dd + 'T' + hh + ':' + mi;
        parseResult.className = 'parse-result show';
        parseResult.innerHTML = '✅ 时间：<strong>' + fmtTime(parsedTime) + '</strong>';
      }

      // 如果输入框有内容，保留标题解析
      if (nlInput.value.trim()) {
        const r2 = parseNaturalLanguage(nlInput.value.trim());
        titleInput.value = r2.title;
      }
    };
  });

  // 手动修改时间
  timeInput.onchange = function() {
    if (this.value) { parsedTime = new Date(this.value); parseResult.className = 'parse-result show';
      parseResult.innerHTML = '✅ 手动设置：<strong>' + fmtTime(parsedTime) + '</strong>'; }
    else { parsedTime = null; parseResult.className = 'parse-result no-time show';
      parseResult.innerHTML = '📌 无截止时间'; }
  };

  // 语音录入（简化版，用 Web Speech API）
  overlay.querySelector('#voiceBtn').onclick = function() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) { showToast('⚠️ 当前浏览器不支持语音识别'); return; }

    const btn = this;
    btn.classList.add('listening');
    const recognition = new SpeechRecognition();
    recognition.lang = 'zh-CN';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onresult = function(event) {
      const text = event.results[0][0].transcript;
      nlInput.value = text;
      nlInput.oninput();
    };
    recognition.onerror = function() { btn.classList.remove('listening'); showToast('⚠️ 语音识别失败，请手动输入'); };
    recognition.onend = function() { btn.classList.remove('listening'); };
    recognition.start();
  };

  // 确认添加
  overlay.querySelector('#btnConfirmAdd').onclick = function() {
    const title = titleInput.value.trim() || parsedTitle || nlInput.value.trim() || '未命名待办';
    const important = overlay.querySelector('#importantToggle').classList.contains('on');

    const task = {
      id: uid(),
      title: title,
      time: parsedTime ? parsedTime.toISOString() : null,
      status: 'pending',
      important: important,
      delayCount: 0,
      nextRemindAt: null,
      doingStartedAt: null,
      checkBackAt: null,
      completedAt: null,
      createdAt: Date.now(),
      reminderActive: false,
    };

    tasks.push(task);
    saveTasks(tasks);
    overlay.remove();
    render();
    showToast('✅ 已添加：' + task.title);

    // 如果时间很近了（5分钟内），直接提醒
    if (parsedTime && (parsedTime - Date.now()) < 5 * 60 * 1000 && (parsedTime - Date.now()) > -60000) {
      setTimeout(() => triggerReminder(task), parsedTime - Date.now());
    }
  };

  // 回车提交
  nlInput.onkeydown = function(e) {
    if (e.key === 'Enter') {
      overlay.querySelector('#btnConfirmAdd').click();
    }
  };
}

// ---------- Tab 切换 ----------
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector('[data-tab="' + tab + '"]').classList.add('active');
  render();
}

// ---------- 徽章更新 ----------
function updateBadges() {
  const pendingCount = tasks.filter(t => t.status === 'pending').length;
  const doingCount = tasks.filter(t => t.status === 'doing').length;
  const total = pendingCount + doingCount;

  // 顶部徽章
  const headerBadge = document.getElementById('headerBadge');
  headerBadge.textContent = total || '';
  headerBadge.style.display = total ? '' : 'none';

  // Tab 徽章
  const tabPending = document.getElementById('tabPendingBadge');
  tabPending.textContent = pendingCount || '';
  tabPending.style.display = pendingCount ? '' : 'none';

  const tabDoing = document.getElementById('tabDoingBadge');
  tabDoing.textContent = doingCount || '';
  tabDoing.style.display = doingCount ? '' : 'none';
}

// ---------- Toast ----------
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2100);
}

// ---------- Helper ----------
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---------- 设置 ----------
function openSettings() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-mask';
  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };

  const doneCount = tasks.filter(t => t.status === 'done').length;
  const totalCreated = tasks.length;

  overlay.innerHTML = `
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <h3 style="margin-bottom:20px;">⚙️ 设置</h3>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);">
          <span>总计待办</span><span style="font-weight:700;">${totalCreated} 项</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);">
          <span>已完成</span><span style="font-weight:700;">${doneCount} 项</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);">
          <span>数据存储</span><span style="color:var(--sub);font-size:13px;">手机本地 localStorage</span>
        </div>
        <button class="btn btn-secondary" id="btnExport">📤 导出数据备份</button>
        <button class="btn btn-secondary" id="btnImport">📥 导入数据恢复</button>
        <button class="btn btn-danger" id="btnClearDone">🧹 清除已完成</button>
        <button class="btn btn-danger" id="btnClearAll">⚠️ 清除全部数据</button>
        <input type="file" id="importFile" accept=".json" style="display:none;">
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelector('#btnExport').onclick = () => {
    const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'biewang-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    showToast('📤 备份已下载');
  };

  overlay.querySelector('#btnImport').onclick = () => overlay.querySelector('#importFile').click();
  overlay.querySelector('#importFile').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = JSON.parse(reader.result);
        if (!Array.isArray(imported)) throw new Error('Invalid format');
        tasks = imported;
        saveTasks(tasks);
        render();
        showToast('📥 数据已恢复（' + tasks.length + ' 项）');
        overlay.remove();
      } catch (err) { showToast('⚠️ 文件格式不正确'); }
    };
    reader.readAsText(file);
  };

  overlay.querySelector('#btnClearDone').onclick = () => {
    if (confirm('确定要清除所有已完成的待办吗？')) {
      tasks = tasks.filter(t => t.status !== 'done');
      saveTasks(tasks);
      render();
      showToast('🧹 已清除已完成项');
      overlay.remove();
    }
  };

  overlay.querySelector('#btnClearAll').onclick = () => {
    if (confirm('⚠️ 确定要清除全部数据吗？此操作不可恢复！\n\n建议先导出备份。')) {
      if (confirm('再次确认：删除所有数据？')) {
        tasks = [];
        saveTasks(tasks);
        render();
        showToast('🗑 全部数据已清除');
        overlay.remove();
      }
    }
  };
}

// ---------- 应用初始化 ----------
function init() {
  // 清理旧的提醒状态
  tasks.forEach(t => { t.reminderActive = false; t.nextRemindAt = null; });
  saveTasks(tasks);

  render();
  startReminderLoop();
  initServiceWorker();

  // 请求通知权限
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission().catch(() => {});
  }
}

// 启动
init();

console.log('📋 「别忘」已就绪');
console.log('  数据位置：浏览器 localStorage (' + STORAGE_KEY + ')');
console.log('  提醒检查：每15秒轮询一次');
console.log('  添加方式：自然语言解析 / 快捷时间标签 / 手动选择');
console.log('  核心流程：提醒 → 开始做 → 计时 → 回访确认 → 完成');
</script>
